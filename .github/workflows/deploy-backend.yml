name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - 'services/prediction-api/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via native SSH rsync
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          set -e
          echo "Setting up SSH key and keepalive..."
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          cat << 'SSHEOF' >> ~/.ssh/config
          Host *
            ServerAliveInterval 15
            ServerAliveCountMax 240
            TCPKeepAlive yes
            StrictHostKeyChecking no
          SSHEOF

          echo "🚀 Syncing backend files to EC2..."
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=240 "$USER@$HOST" "mkdir -p /home/ubuntu/app '/home/ubuntu/Muncipal corp Dataset'"
          rsync -avz -e "ssh -i ~/.ssh/id_rsa -o ServerAliveInterval=15" --exclude="venv" --delete services/prediction-api/ "$USER@$HOST:/home/ubuntu/app/"
          rsync -avz -e "ssh -i ~/.ssh/id_rsa -o ServerAliveInterval=15" "Muncipal corp Dataset/" "$USER@$HOST:/home/ubuntu/Muncipal corp Dataset/"

          echo "🔄 Running setup and service restart on EC2..."
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=240 "$USER@$HOST" "bash -s" << 'EOF'
            set -e
            APP_DIR="/home/ubuntu/app"
            if [ ! -f "$APP_DIR/venv/bin/python" ]; then
              python3 -m venv "$APP_DIR/venv"
            fi
            "$APP_DIR/venv/bin/python" -m pip install --upgrade pip
            "$APP_DIR/venv/bin/python" -m pip install -r "$APP_DIR/requirements.txt"
            
            echo "🧠 Checking waterlogging ML model..."
            cd "$APP_DIR"
            if [ -f "$APP_DIR/data/processed/training_table.csv" ] && [ ! -f "$APP_DIR/models/waterlogging_1h.joblib" ]; then
              mkdir -p "$APP_DIR/models"
              echo "Pre-processed training table found. Training model..."
              "$APP_DIR/venv/bin/python" -m app.cli train || echo "Model train skipped"
            fi

            echo "🔄 Restarting zplus-backend systemd service..."
            sudo systemctl restart zplus-backend
            
            echo "⏳ Polling backend service health on port 8000..."
            HEALTHY=false
            for i in $(seq 1 20); do
              if curl -s -f http://127.0.0.1:8000/health > /dev/null 2>&1; then
                HEALTHY=true
                echo "✅ Backend service is healthy! (Attempt $i)"
                break
              fi
              echo "Waiting for uvicorn to bind port 8000 (attempt $i/20)..."
              sleep 2
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "❌ Backend health check failed after 40 seconds. Dumping journalctl:"
              sudo journalctl -u zplus-backend -n 80 --no-pager
              exit 1
            fi

            curl -f http://127.0.0.1:8000/health
            echo ""
            echo "✅ Deployment finished successfully!"
          EOF

