name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - 'services/prediction-api/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via native SSH rsync
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          set -e
          echo "Setting up SSH key..."
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

          echo "🚀 Syncing backend files to EC2..."
          ssh "$USER@$HOST" "mkdir -p /home/ubuntu/app '/home/ubuntu/Muncipal corp Dataset'"
          rsync -avz -e "ssh -i ~/.ssh/id_rsa" --exclude="venv" --delete services/prediction-api/ "$USER@$HOST:/home/ubuntu/app/"
          rsync -avz -e "ssh -i ~/.ssh/id_rsa" "Muncipal corp Dataset/" "$USER@$HOST:/home/ubuntu/Muncipal corp Dataset/"

          echo "🔄 Running setup and service restart on EC2..."
          ssh "$USER@$HOST" "bash -s" << 'EOF'
            set -e
            APP_DIR="/home/ubuntu/app"
            if [ ! -f "$APP_DIR/venv/bin/python" ]; then
              python3 -m venv "$APP_DIR/venv"
            fi
            "$APP_DIR/venv/bin/python" -m pip install --upgrade pip
            "$APP_DIR/venv/bin/python" -m pip install -r "$APP_DIR/requirements.txt"
            
            echo "🧠 Checking and training waterlogging ML model..."
            cd "$APP_DIR"
            if [ ! -f "$APP_DIR/models/waterlogging_1h.joblib" ]; then
              mkdir -p "$APP_DIR/models"
              "$APP_DIR/venv/bin/python" -m app.cli build-dataset || echo "Dataset build skipped/cached"
              "$APP_DIR/venv/bin/python" -m app.cli train || echo "Model train skipped"
            fi

            sudo systemctl restart zplus-backend
            echo "Waiting for backend service to bind port 8000..."
            sleep 4
            curl -f http://127.0.0.1:8000/health
            echo "✅ Deployment finished successfully!"
          EOF
