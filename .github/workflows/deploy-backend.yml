name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - 'services/prediction-api/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Backend Files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "services/prediction-api/*"
          target: "/home/ubuntu/app-staging"
          strip_components: 2

      - name: Deploy and Restart on EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Deploying staging files to active backend..."

            APP_DIR="/home/ubuntu/app"
            STAGING_DIR="/home/ubuntu/app-staging"

            mkdir -p "$APP_DIR"
            rsync -av "$STAGING_DIR/" "$APP_DIR/"
            rm -rf "$STAGING_DIR"

            # Ensure virtual environment exists
            if [ ! -d "$APP_DIR/venv" ]; then
              python3 -m venv "$APP_DIR/venv"
            fi

            # Install dependencies
            "$APP_DIR/venv/bin/pip" install --upgrade pip
            "$APP_DIR/venv/bin/pip" install -r "$APP_DIR/requirements.txt"

            # Restart backend systemd daemon
            sudo systemctl restart zplus-backend

            # Verify health
            sleep 3
            curl -f http://127.0.0.1:8000/health || (echo "Health check failed!" && exit 1)

            echo "✅ Backend successfully deployed and active!"
