name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - 'services/prediction-api/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via native SSH rsync
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          set -e
          echo "Setting up SSH key..."
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

          echo "🚀 Syncing backend files to EC2..."
          ssh "$USER@$HOST" "mkdir -p /home/ubuntu/app"
          rsync -avz -e "ssh -i ~/.ssh/id_rsa" --delete services/prediction-api/ "$USER@$HOST:/home/ubuntu/app/"

          echo "🔄 Running setup and service restart on EC2..."
          ssh "$USER@$HOST" bash -c "'
            set -e
            APP_DIR=\"/home/ubuntu/app\"
            if [ ! -f \"\$APP_DIR/venv/bin/python\" ]; then
              python3 -m venv \"\$APP_DIR/venv\"
            fi
            \"\$APP_DIR/venv/bin/python\" -m pip install --upgrade pip
            \"\$APP_DIR/venv/bin/python\" -m pip install -r \"\$APP_DIR/requirements.txt\"
            sudo systemctl restart zplus-backend
            echo "Waiting for backend service to bind port 8000..."
            for i in {1..10}; do
              if curl -s -f http://127.0.0.1:8000/health > /dev/null; then
                echo "✅ Backend is healthy and responding!"
                break
              fi
              echo "Waiting for startup ($i/10)..."
              sleep 2
            done
            curl -f http://127.0.0.1:8000/health
            echo "✅ Deployment finished!"
          '"
