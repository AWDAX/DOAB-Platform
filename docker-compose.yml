version: '3.8'

services:
  # 1. Local PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: doab-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-doab}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-doab}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - doab-network

  # 2. FastAPI Prediction & Geospatial Backend Microservice
  backend:
    build:
      context: .
      dockerfile: services/prediction-api/Dockerfile
    container_name: doab-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-doab}
      - PREDICTION_CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80,http://127.0.0.1:5173,http://127.0.0.1:8000
      - PREDICTION_RATE_LIMIT_PER_MINUTE=60
      - PREDICTION_FORECAST_CACHE_TTL_S=900
      - GOOGLE_ROUTES_API_KEY=${GOOGLE_ROUTES_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - doab-network

  # 3. React Frontend PWA
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doab-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_PREDICTION_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - doab-network

volumes:
  postgres_data:
    driver: local

networks:
  doab-network:
    driver: bridge
