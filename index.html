        <h1>DOAB (दोआब) — Dual-Climate Geospatial &amp; Civic Safety Platform</h1>
        <p><strong>Detect → Order → Alert → Back-check</strong></p>
        <p>DOAB is an AI-powered municipal intelligence and citizen life-safety platform engineered to tackle India's extreme dual-climate crises: urban flash flooding and waterlogging during monsoon, and acute drought and tanker logistics deficits during dry seasons.</p>
        <p>Core Capabilities:</p>
        <ul>
          <li><strong>Real-time 3D Inundation &amp; Hazard Radar:</strong> Multi-layer spatial clustering with 15cm road flood thresholds.</li>
          <li><strong>AI Elevation-Aware Safe Routing:</strong> Dijkstra pathfinding over Copernicus Digital Elevation Models (DEM) prioritizing dry ridgelines over waterlogged underpasses.</li>
          <li><strong>Dual-Climate Intelligence:</strong> Dynamic seasonal modes for Monsoon Flood Mitigation and Drought Water Logistics.</li>
          <li><strong>Emergency Civic Dispatch:</strong> Real-time situational awareness and localized responder coordination.</li>
        </ul>
